<div id="products" class="py-5 text-center">
    <H2 class="pb-4">La carte</H2>
    <div class="container pb-4">
        <div class="row">
            @for (produit of ListeProduits(); track produit.id; let i = $index) {
                <div class="col-12 col-md-4 d-flex justify-content-center">
                    <div class="card rounded-4">
                        <img [src]="produit.image_url" class="card-img-top rounded-top-4" alt="...">
                        <div class="card-body">
                            <h4 class="card-title">{{ produit.name }}</h4>
                            <p class="card-text">{{ produit.description | textLengths:(i < 2 ? 3 : 2) }}</p>
                            <p class="card-text">{{ produit.price | number:'1.2-2':'fr'}} €</p>
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>    
</div>
